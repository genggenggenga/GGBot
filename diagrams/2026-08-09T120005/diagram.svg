<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="fusionGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <style>
      text { font-family: "Noto Sans SC", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-size: 14px; font-weight: 400; fill: #dbeafe; }
      .lane-label { font-size: 18px; font-weight: 700; fill: #172554; }
      .stage-label { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 1px; }
      .node-title { font-size: 16px; font-weight: 700; fill: #172554; }
      .body { font-size: 13px; font-weight: 400; fill: #334155; }
      .small { font-size: 11px; font-weight: 400; fill: #475569; }
      .tiny { font-size: 10px; font-weight: 400; fill: #64748b; }
      .mono { font-family: "Noto Sans SC", sans-serif; font-size: 12px; font-weight: 600; fill: #312e81; }
      .white-label { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .flow { fill: none; stroke: #4f46e5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .index-flow { fill: none; stroke: #0f766e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .fusion-flow { fill: none; stroke: #d97706; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .reject-flow { fill: none; stroke: #dc2626; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1600" height="1600" fill="#f7f2e8"/>

  <!-- Header -->
  <g>
    <rect x="40" y="28" width="1520" height="92" rx="20" fill="url(#headerGradient)"/>
    <rect x="62" y="51" width="46" height="46" rx="12" fill="#ffffff" opacity="0.14"/>
    <path d="M76 63 H94 M76 72 H94 M76 81 H89" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="94" cy="85" r="7" fill="#2dd4bf"/>
    <text x="126" y="69" class="title">4.4 Hybrid RAG：多查询检索与受约束生成</text>
    <text x="127" y="96" class="subtitle">QueryPlanner · Dense / BM25 · RRF · Rerank · Grounded Answer</text>
    <rect x="1356" y="56" width="168" height="36" rx="18" fill="#ffffff" opacity="0.13"/>
    <text x="1440" y="79" text-anchor="middle" class="white-label">KnowledgeRuntime</text>
  </g>

  <!-- Import and indexing lane -->
  <g>
    <rect x="40" y="144" width="1520" height="500" rx="22" fill="#fffdf8" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="40" y="144" width="34" height="500" rx="17" fill="#e0e7ff"/>
    <text x="94" y="180" class="lane-label">上方泳道 · 导入建索引</text>
    <text x="1498" y="180" text-anchor="end" class="stage-label">OFFLINE INDEXING</text>
  </g>

  <!-- Import sources -->
  <g>
    <rect x="94" y="220" width="154" height="37" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
    <path d="M111 230 H123 L129 236 V248 H111 Z M123 230 V236 H129" fill="none" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="142" y="244" class="body">TXT</text>

    <rect x="94" y="268" width="154" height="37" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
    <path d="M111 278 H123 L129 284 V296 H111 Z M123 278 V284 H129" fill="none" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="142" y="292" class="body">Markdown</text>

    <rect x="94" y="316" width="154" height="37" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
    <path d="M111 326 H123 L129 332 V344 H111 Z M123 326 V332 H129" fill="none" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="142" y="340" class="body">PDF</text>

    <rect x="94" y="364" width="154" height="37" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
    <path d="M111 374 H123 L129 380 V392 H111 Z M123 374 V380 H129" fill="none" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="142" y="388" class="body">JSON</text>
    <text x="171" y="425" text-anchor="middle" class="small">多格式统一导入</text>
  </g>

  <!-- Source aggregation -->
  <polyline points="248,238 265,238 265,382 248,382" class="flow"/>
  <line x1="248" y1="286" x2="265" y2="286" class="flow"/>
  <line x1="248" y1="334" x2="265" y2="334" class="flow"/>
  <line x1="265" y1="310" x2="292" y2="310" class="flow"/>
  <polygon points="292,310 281,304 281,316" fill="#4f46e5"/>

  <!-- Loader -->
  <g>
    <rect x="292" y="220" width="250" height="210" rx="20" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="292" y="220" width="250" height="42" rx="20" fill="#4f46e5"/>
    <rect x="292" y="242" width="250" height="20" fill="#4f46e5"/>
    <text x="417" y="247" text-anchor="middle" class="white-label">Loader · 结构感知解析</text>
    <circle cx="326" cy="301" r="15" fill="#eef2ff"/>
    <path d="M318 301 H334 M326 293 V309" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
    <text x="354" y="296" class="body">Markdown</text>
    <text x="354" y="317" class="mono">保留 section path</text>
    <circle cx="326" cy="359" r="15" fill="#eef2ff"/>
    <path d="M318 353 H334 V365 H318 Z M321 349 H331" fill="none" stroke="#4f46e5" stroke-width="1.8"/>
    <text x="354" y="354" class="body">PDF</text>
    <text x="354" y="375" class="mono">保留 page</text>
    <text x="417" y="409" text-anchor="middle" class="tiny">元数据随正文进入切块阶段</text>
  </g>

  <!-- Loader to chunk -->
  <line x1="542" y1="325" x2="600" y2="325" class="flow"/>
  <polygon points="600,325 589,319 589,331" fill="#4f46e5"/>

  <!-- Chunk sections -->
  <g>
    <rect x="600" y="220" width="315" height="210" rx="20" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="600" y="220" width="315" height="42" rx="20" fill="#4338ca"/>
    <rect x="600" y="242" width="315" height="20" fill="#4338ca"/>
    <text x="757" y="247" text-anchor="middle" class="white-label">chunk_sections · 层级切块</text>
    <rect x="625" y="285" width="118" height="36" rx="18" fill="#eef2ff"/>
    <text x="684" y="308" text-anchor="middle" class="mono">size = 500</text>
    <rect x="760" y="285" width="128" height="36" rx="18" fill="#eef2ff"/>
    <text x="824" y="308" text-anchor="middle" class="mono">overlap = 80</text>
    <path d="M635 348 H878" stroke="#c7d2fe" stroke-width="9" stroke-linecap="round"/>
    <path d="M635 348 H752" stroke="#6366f1" stroke-width="9" stroke-linecap="round"/>
    <path d="M726 367 H844" stroke="#818cf8" stroke-width="9" stroke-linecap="round"/>
    <text x="626" y="405" class="body">生成：</text>
    <text x="680" y="405" class="mono">chunk_id</text>
    <text x="759" y="405" class="body">+</text>
    <text x="782" y="405" class="mono">parent_id</text>
  </g>

  <!-- Chunk to runtime -->
  <line x1="915" y1="325" x2="940" y2="325" class="index-flow"/>
  <polygon points="940,325 929,319 929,331" fill="#0f766e"/>

  <!-- Runtime hub -->
  <g>
    <circle cx="1040" cy="325" r="100" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
    <circle cx="1040" cy="325" r="76" fill="#ffffff" stroke="#5eead4" stroke-width="2"/>
    <path d="M1009 299 C1009 285 1071 285 1071 299 V348 C1071 362 1009 362 1009 348 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <ellipse cx="1040" cy="299" rx="31" ry="10" fill="#99f6e4" stroke="#0f766e" stroke-width="1.5"/>
    <path d="M1009 318 C1009 332 1071 332 1071 318 M1009 337 C1009 351 1071 351 1071 337" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    <text x="1040" y="386" text-anchor="middle" class="node-title">KnowledgeRuntime</text>
    <text x="1040" y="406" text-anchor="middle" class="small">一次切块 · 统一 chunk_id</text>
  </g>

  <!-- Runtime fan-out -->
  <polyline points="1040,425 1040,454 370,454 370,478" class="index-flow"/>
  <polyline points="1040,454 800,454 800,478" class="index-flow"/>
  <polyline points="1040,454 1230,454 1230,478" class="index-flow"/>
  <polygon points="370,478 364,467 376,467" fill="#0f766e"/>
  <polygon points="800,478 794,467 806,467" fill="#0f766e"/>
  <polygon points="1230,478 1224,467 1236,467" fill="#0f766e"/>
  <rect x="1018" y="437" width="44" height="20" rx="10" fill="#d1fae5"/>
  <text x="1040" y="451" text-anchor="middle" class="tiny">sync</text>

  <!-- Storage targets -->
  <g>
    <rect x="190" y="478" width="360" height="112" rx="18" fill="#ecfdf5" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="228" cy="516" r="20" fill="#0f766e"/>
    <path d="M217 509 H239 M217 516 H239 M217 523 H239" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="262" y="513" class="node-title">Canonical Chunk Store</text>
    <text x="262" y="536" class="small">文档、Chunk 与来源元数据</text>
    <text x="262" y="555" class="small">单一事实源 · 完整 citation metadata</text>
    <text x="262" y="577" class="mono">source · section · page</text>

    <rect x="620" y="478" width="360" height="112" rx="18" fill="#ecfdf5" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="658" cy="516" r="20" fill="#0f766e"/>
    <path d="M649 526 L654 507 L660 518 L667 502" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="692" y="513" class="node-title">Canonical Chroma Dense Index</text>
    <text x="692" y="536" class="small">复用同一 collection 向量</text>
    <text x="692" y="555" class="small">服务语义近邻召回</text>
    <text x="692" y="577" class="mono">cosine similarity</text>

    <rect x="1050" y="478" width="360" height="112" rx="18" fill="#ecfdf5" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="1088" cy="516" r="20" fill="#0f766e"/>
    <text x="1088" y="521" text-anchor="middle" class="white-label">Aa</text>
    <text x="1122" y="513" class="node-title">BM25 Inverted Index</text>
    <text x="1122" y="536" class="small">词项倒排索引</text>
    <text x="1122" y="555" class="small">服务关键词与精确命中</text>
    <text x="1122" y="577" class="mono">term frequency</text>
  </g>

  <!-- Online retrieval lane -->
  <g>
    <rect x="40" y="668" width="1520" height="748" rx="22" fill="#fffdf8" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="40" y="668" width="34" height="748" rx="17" fill="#ccfbf1"/>
    <text x="94" y="704" class="lane-label">下方泳道 · 在线检索与回答</text>
    <text x="1498" y="704" text-anchor="end" class="stage-label">ONLINE RETRIEVAL</text>
  </g>

  <!-- Query input -->
  <g>
    <rect x="550" y="735" width="500" height="92" rx="22" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <circle cx="603" cy="781" r="22" fill="#ccfbf1"/>
    <circle cx="598" cy="776" r="9" fill="none" stroke="#0f766e" stroke-width="2.5"/>
    <line x1="605" y1="783" x2="615" y2="793" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>
    <text x="642" y="771" class="node-title">QueryPlanner · 最多 3 条查询</text>
    <text x="642" y="795" class="body">指代消解 · 原问题保留 · Multi-Query</text>
    <rect x="881" y="757" width="138" height="46" rx="16" fill="#ecfdf5"/>
    <text x="950" y="776" text-anchor="middle" class="tiny">PARALLEL</text>
    <text x="950" y="794" text-anchor="middle" class="mono">Dense + BM25</text>
  </g>

  <!-- Query split -->
  <line x1="800" y1="827" x2="800" y2="851" class="flow"/>
  <circle cx="800" cy="861" r="12" fill="#4f46e5"/>
  <path d="M794 861 H806 M800 855 V867" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <polyline points="788,861 440,861 440,875" class="flow"/>
  <polyline points="812,861 1160,861 1160,875" class="flow"/>
  <polygon points="440,875 434,864 446,864" fill="#4f46e5"/>
  <polygon points="1160,875 1154,864 1166,864" fill="#4f46e5"/>

  <!-- Dense recall -->
  <g>
    <rect x="180" y="875" width="520" height="150" rx="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <rect x="205" y="897" width="70" height="28" rx="14" fill="#4f46e5"/>
    <text x="240" y="916" text-anchor="middle" class="white-label">Dense</text>
    <text x="293" y="917" class="node-title">语义召回</text>
    <text x="205" y="951" class="body">BGE embedding + cosine similarity</text>
    <text x="205" y="977" class="small">捕获语义近邻、同义表达与上下文相似性</text>
    <rect x="566" y="983" width="110" height="25" rx="12" fill="#c7d2fe"/>
    <text x="621" y="1000" text-anchor="middle" class="mono">candidate_k</text>
  </g>

  <!-- BM25 recall -->
  <g>
    <rect x="900" y="875" width="520" height="150" rx="22" fill="#ecfdf5" stroke="#14b8a6" stroke-width="2"/>
    <rect x="925" y="897" width="70" height="28" rx="14" fill="#0f766e"/>
    <text x="960" y="916" text-anchor="middle" class="white-label">BM25</text>
    <text x="1013" y="917" class="node-title">词项召回</text>
    <text x="925" y="951" class="body">英文 token + 中文单字精确词项</text>
    <text x="925" y="977" class="small">强化专有名词、编号、关键词与字面精确命中</text>
    <rect x="1286" y="983" width="110" height="25" rx="12" fill="#a7f3d0"/>
    <text x="1341" y="1000" text-anchor="middle" class="mono">candidate_k</text>
  </g>

  <!-- Recall merge -->
  <polyline points="440,1025 440,1047 700,1047 700,1070" class="flow"/>
  <polyline points="1160,1025 1160,1047 900,1047 900,1070" class="index-flow"/>
  <polygon points="700,1070 694,1059 706,1059" fill="#4f46e5"/>
  <polygon points="900,1070 894,1059 906,1059" fill="#0f766e"/>

  <!-- RRF fusion -->
  <g>
    <rect x="570" y="1070" width="460" height="190" rx="24" fill="url(#fusionGradient)" stroke="#d97706" stroke-width="2.5"/>
    <circle cx="618" cy="1114" r="24" fill="#f59e0b"/>
    <path d="M607 1106 L618 1114 L629 1106 M607 1122 L618 1114 L629 1122" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="660" y="1110" class="node-title">RRF 排名融合</text>
    <text x="660" y="1132" class="small">Reciprocal Rank Fusion</text>
    <rect x="600" y="1152" width="400" height="38" rx="11" fill="#ffffff" stroke="#fbbf24" stroke-width="1"/>
    <text x="800" y="1177" text-anchor="middle" class="mono">Σ 1 / (60 + rank)</text>
    <text x="600" y="1218" class="body">仅按各路排名融合，不直接比较原始分数</text>
    <text x="600" y="1242" class="small">保留 dense_score / bm25_score / rrf_score</text>
  </g>

  <!-- RRF to optional reranker -->
  <polyline points="680,1260 680,1275 340,1275" class="fusion-flow"/>
  <polygon points="340,1275 351,1269 351,1281" fill="#d97706"/>

  <!-- Optional Cross-Encoder -->
  <g>
    <rect x="190" y="1275" width="300" height="115" rx="20" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <rect x="212" y="1294" width="56" height="25" rx="12" fill="#f59e0b"/>
    <text x="240" y="1312" text-anchor="middle" class="white-label">可选</text>
    <text x="286" y="1313" class="node-title">Cross-Encoder</text>
    <text x="212" y="1344" class="body">只重排 RRF 融合候选</text>
    <text x="212" y="1368" class="small">不扩大召回集 · 不重跑全库</text>
  </g>

  <!-- Reranker to top-k and bypass -->
  <line x1="490" y1="1332" x2="650" y2="1332" class="fusion-flow"/>
  <polygon points="650,1332 639,1326 639,1338" fill="#d97706"/>
  <polyline points="920,1260 920,1271 850,1271 850,1285" class="fusion-flow dashed"/>
  <polygon points="850,1285 844,1274 856,1274" fill="#d97706"/>
  <rect x="862" y="1257" width="52" height="21" rx="10" fill="#fff7ed" stroke="#fbbf24" stroke-width="1"/>
  <text x="888" y="1272" text-anchor="middle" class="tiny">旁路</text>

  <!-- Top K -->
  <g>
    <rect x="650" y="1285" width="270" height="100" rx="20" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="785" y="1317" text-anchor="middle" class="node-title">截取 top_k</text>
    <path d="M687 1339 H883" stroke="#fed7aa" stroke-width="10" stroke-linecap="round"/>
    <path d="M687 1339 H805" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
    <text x="785" y="1370" text-anchor="middle" class="small">小而高质量的证据候选集</text>
  </g>

  <!-- Top-k to threshold -->
  <line x1="920" y1="1335" x2="1020" y2="1335" class="fusion-flow"/>
  <polygon points="1020,1335 1009,1329 1009,1341" fill="#d97706"/>

  <!-- Threshold decision -->
  <g>
    <polygon points="1080,1270 1140,1335 1080,1400 1020,1335" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/>
    <text x="1080" y="1325" text-anchor="middle" class="node-title">mode-specific</text>
    <text x="1080" y="1345" text-anchor="middle" class="node-title">threshold</text>
    <text x="1080" y="1365" text-anchor="middle" class="small">证据足够？</text>
  </g>

  <!-- Yes outcome -->
  <polyline points="1080,1270 1080,1250 1220,1250" class="index-flow"/>
  <polygon points="1220,1250 1209,1244 1209,1256" fill="#0f766e"/>
  <rect x="1114" y="1235" width="38" height="20" rx="10" fill="#d1fae5"/>
  <text x="1133" y="1249" text-anchor="middle" class="tiny">YES</text>
  <g>
    <rect x="1220" y="1195" width="310" height="125" rx="18" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <circle cx="1250" cy="1225" r="14" fill="#0f766e"/>
    <path d="M1243 1225 L1248 1230 L1257 1219" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1276" y="1230" class="node-title">Grounded Answer</text>
    <text x="1240" y="1257" class="small">Top-N 去重 · chunk / token 双预算</text>
    <text x="1240" y="1281" class="body">逐段引用 + 受保护事实校验</text>
    <text x="1240" y="1305" class="mono">validated citations only</text>
  </g>

  <!-- No outcome -->
  <polyline points="1140,1335 1175,1335 1175,1363 1220,1363" class="reject-flow"/>
  <polygon points="1220,1363 1209,1357 1209,1369" fill="#dc2626"/>
  <rect x="1153" y="1342" width="36" height="20" rx="10" fill="#fee2e2"/>
  <text x="1171" y="1356" text-anchor="middle" class="tiny" fill="#b91c1c">NO</text>
  <g>
    <rect x="1220" y="1328" width="310" height="74" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <circle cx="1250" cy="1353" r="14" fill="#dc2626"/>
    <path d="M1244 1347 L1256 1359 M1256 1347 L1244 1359" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="1276" y="1358" class="node-title" fill="#991b1b">拒答</text>
    <text x="1240" y="1385" class="small">检索不足 / 生成明确 insufficient</text>
  </g>

  <!-- Core conclusion -->
  <g>
    <rect x="40" y="1438" width="1520" height="112" rx="20" fill="#172554"/>
    <circle cx="82" cy="1480" r="18" fill="#f59e0b"/>
    <path d="M74 1480 L80 1486 L91 1473" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="1475" class="white-label">核心结论</text>
    <text x="116" y="1501" class="subtitle">不同召回分数不直接比较；先按排名做 RRF 融合，再对小候选集进行可选 Cross-Encoder 重排。</text>
    <text x="116" y="1527" class="subtitle">通过门控后按证据预算生成；引用、逐段事实和新增数字校验失败时降级为抽取式回答。</text>
    <rect x="1135" y="1471" width="389" height="42" rx="21" fill="#ffffff" opacity="0.12"/>
    <text x="1329" y="1497" text-anchor="middle" class="subtitle">真实增益仍待真实模型与真实数据验证</text>
  </g>

  <!-- Footer -->
